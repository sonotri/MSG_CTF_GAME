<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MSG Dino Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game"></canvas>

    <section id="title-screen" class="overlay">
      <div class="title-layout">
        <h1>MSG DINO RUN</h1>

        <aside class="panel title-board">
          <h2>RANKING</h2>
          <ol id="title-board" class="board"></ol>
        </aside>

        <div class="panel title-main">
          <input id="player-name" maxlength="12" autocomplete="off" placeholder="NAME" aria-label="이름">
          <input id="player-pw" type="password" maxlength="20" autocomplete="off" placeholder="PASSWORD" aria-label="비밀번호">
          <p id="name-hint" class="name-hint" aria-live="polite"></p>

          <div class="dino-select">
            <button id="dino-prev" class="arrow" aria-label="이전 공룡">
              <svg viewBox="0 0 5 9" shape-rendering="crispEdges"><path d="M4 0h1v9h-1zM3 1h1v7h-1zM2 2h1v5h-1zM1 3h1v3h-1zM0 4h1v1h-1z"/></svg>
            </button>
            <img id="dino-preview" alt="">
            <button id="dino-next" class="arrow" aria-label="다음 공룡">
              <svg viewBox="0 0 5 9" shape-rendering="crispEdges"><path d="M0 0h1v9h-1zM1 1h1v7h-1zM2 2h1v5h-1zM3 3h1v3h-1zM4 4h1v1h-1z"/></svg>
            </button>
          </div>
          <p id="dino-field" class="dino-field"></p>

          <button id="start-btn" class="btn">START</button>
        </div>

        <p class="keys">점프 <kbd>Space</kbd>/<kbd>↑</kbd> (공중에서 한 번 더 = 2단 점프) · 슬라이드 <kbd>↓</kbd> · 공룡 선택 <kbd>←</kbd> <kbd>→</kbd><br><span id="course-info"></span></p>
      </div>
    </section>

    <section id="result-screen" class="overlay" hidden>
      <h1 id="result-title">GOAL!</h1>
      <div class="title-grid">
        <div class="panel">
          <table id="result-rows"></table>
          <p id="result-meta" class="sub"></p>
          <p id="result-best" class="result-best"></p>
          <div class="row">
            <button id="retry-btn" class="btn">RETRY</button>
            <button id="menu-btn" class="btn ghost">MENU</button>
          </div>
        </div>
        <div class="panel card-panel">
          <h2>MY CARD</h2>
          <div id="card-qr"></div>
          <p id="card-note" class="sub"></p>
          <button id="card-save" class="btn ghost">이미지 저장</button>
        </div>
        <div class="panel">
          <h2>RANKING</h2>
          <ol id="result-board" class="board"></ol>
        </div>
      </div>
    </section>
  </main>

  <div id="touch-controls">
    <button id="btn-slide">SLIDE</button>
    <button id="btn-jump">JUMP</button>
  </div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sprite-data.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/course.js"></script>
  <script src="js/store.js"></script>
  <script src="js/card.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
